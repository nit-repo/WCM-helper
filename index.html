<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCM Brief Analyser</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='%231450F5'><rect x='1' y='6' width='6' height='20'/><rect x='9' y='6' width='6' height='20'/><rect x='17' y='6' width='6' height='20'/><rect x='25' y='6' width='6' height='20'/></g></svg>">

  <!-- Zero external requests: no CDN, no webfont, no analytics. -->
  <style>
    :root {
      --kone-blue: #1450F5;
      --blue-20: #D0DCFD;
      --white: #FFFFFF;
      --black: #141414;
      --sand: #F3EEE6;
      --black-60: #727272;
      --black-20: #D0D0D0;
      --hairline: #E6E6E6;
      --red: #C42B1C;
      --amber: #9A6700;
      --amber-bg: #FFF4CE;
      --green: #1A7F37;
      --green-bg: #E8F5EC;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--white);
      color: var(--black);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    header.navbar {
      background: var(--kone-blue);
      color: var(--white);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header.navbar svg { height: 24px; width: auto; display: block; }
    header.navbar h1 { font-size: 19px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
    header.navbar p { margin: 2px 0 0; font-size: 13px; opacity: 0.85; }

    button {
      font: inherit; font-size: 14px; border-radius: 8px;
      border: 1px solid transparent; padding: 9px 16px; cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--kone-blue); color: var(--white); }
    .btn-primary:hover:not(:disabled) { background: #0F3FCC; }
    .btn-ghost { background: var(--white); color: var(--black); border-color: var(--black-20); }
    .btn-ghost:hover:not(:disabled) { background: var(--sand); }

    main {
      display: grid;
      grid-template-columns: minmax(340px, 5fr) minmax(420px, 7fr);
      align-items: start;
      min-height: calc(100vh - 84px);
    }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

    .pane-input { padding: 28px 32px; border-right: 1px solid var(--hairline); }
    .pane-output { padding: 28px 32px; background: #FCFCFC; }

    h2.pane-title {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--black-60); margin: 0 0 12px; font-weight: 600;
    }

    textarea#brief {
      width: 100%; min-height: 340px; padding: 14px;
      border: 1px solid var(--black-20); border-radius: 8px;
      font: inherit; font-size: 14px; resize: vertical; background: var(--white);
    }
    textarea#brief:focus { outline: 2px solid var(--kone-blue); outline-offset: -1px; border-color: var(--kone-blue); }

    .input-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

    .override { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--hairline); }
    .override label { font-size: 13px; color: var(--black-60); display: block; margin-bottom: 6px; }
    select {
      font: inherit; font-size: 14px; padding: 8px 10px; width: 100%;
      border: 1px solid var(--black-20); border-radius: 8px; background: var(--white); color: var(--black);
    }

    .empty-state { color: var(--black-60); font-size: 14px; max-width: 48ch; }
    .empty-state ol { padding-left: 18px; }
    .empty-state code { background: var(--sand); padding: 1px 6px; border-radius: 4px; font-size: 13px; }

    section.card {
      background: var(--white); border: 1px solid var(--hairline); border-radius: 8px;
      padding: 16px 20px; margin-bottom: 16px;
    }
    section.card > h3 {
      margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--black-60); font-weight: 600;
    }

    .headline { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
    .sub { font-size: 13px; color: var(--black-60); margin: 4px 0 0; }
    .cms { font-size: 13px; color: var(--black-60); margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--hairline); }
    .cms strong { color: var(--black); }

    .note { font-size: 13px; margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--sand); }
    .note.warn { background: var(--amber-bg); color: var(--amber); }

    details { margin-top: 12px; }
    summary { font-size: 13px; color: var(--kone-blue); cursor: pointer; }
    ul.signals { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
    ul.signals li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--hairline); }
    ul.signals li:last-child { border-bottom: 0; }
    ul.signals span:last-child { color: var(--black-60); }
    ul.signals em { color: var(--black-60); font-style: normal; font-size: 12px; }

    ul.needs { list-style: none; padding: 0; margin: 0; font-size: 14px; }
    ul.needs li { padding: 7px 0; border-bottom: 1px solid var(--hairline); }
    ul.needs li:last-child { border-bottom: 0; }
    .tick { color: var(--green); font-weight: 700; margin-right: 8px; }
    .cross { color: var(--red); font-weight: 700; margin-right: 8px; }

    ol.steps { padding-left: 20px; margin: 0; font-size: 14px; }
    ol.steps li { padding: 5px 0; }

    ul.questions { padding-left: 20px; margin: 10px 0 0; font-size: 14px; }
    ul.questions li { padding: 5px 0; }

    .ready { font-size: 14px; color: var(--green); background: var(--green-bg); padding: 10px 12px; border-radius: 8px; margin: 0; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--black); color: var(--white); padding: 10px 18px; border-radius: 8px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.18s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>

<body>
  <header class="navbar">
    <svg viewBox="0 0 1193.36 461.76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KONE">
      <rect x="0" y="0" width="269.36" height="461.76" fill="#FFFFFF"></rect>
      <rect x="307.84" y="0" width="269.36" height="461.76" fill="#FFFFFF"></rect>
      <rect x="615.67" y="0" width="269.36" height="461.76" fill="#FFFFFF"></rect>
      <rect x="924.01" y="0" width="269.36" height="461.76" fill="#FFFFFF"></rect>
      <path d="M48.22 132.07 100.91 132.07 100.91 218.29 166.14 132.07 228.2 132.07 156.18 225.09 233.14 329.69 168.65 329.69 100.91 236.06 100.91 329.69 48.22 329.69 48.22 132.07Z" fill="#1450F5"></path>
      <path d="M662.48 132.07 708.51 132.07 789.32 239.42 789.32 132.07 838.22 132.07 838.22 329.69 794.28 329.69 711.22 214.01 711.22 329.69 662.48 329.69 662.48 132.07Z" fill="#1450F5"></path>
      <path d="M442.5 127.72C385.71 127.72 340.03 169.65 340.03 230.84 340.03 292.03 385.71 334.04 442.5 334.04 499.29 334.04 544.99 292.02 544.99 230.84 544.99 169.66 499.31 127.72 442.5 127.72ZM442.5 287.4C414.42 287.4 392.72 264.39 392.72 230.85 392.72 197.31 414.41 174.3 442.5 174.3 470.59 174.3 492.27 197.39 492.27 230.85 492.27 264.31 470.5 287.4 442.5 287.4Z" fill="#1450F5"></path>
      <path d="M1133.44 175.62 1036 175.62 1036 209.03 1117.47 209.03 1117.45 251.34 1036 251.34 1036 284.85 1133.44 284.85 1133.44 329.71 983.93 329.71 983.93 132.05 1133.44 132.05 1133.44 175.62Z" fill="#1450F5"></path>
    </svg>
    <div>
      <h1>WCM Brief Analyser</h1>
      <p>What kind of job is this, what does it need, and how is it done</p>
    </div>
  </header>

  <main>
    <div class="pane-input">
      <h2 class="pane-title">Brief</h2>
      <textarea id="brief" placeholder="Paste the brief here — a ticket, an email, a spreadsheet of URLs, a page of copy."></textarea>

      <div class="input-actions">
        <button id="analyse-btn" class="btn-primary" type="button" disabled>Analyse</button>
        <button id="sample-btn" class="btn-ghost" type="button">Load sample</button>
        <button id="clear-btn" class="btn-ghost" type="button">Clear</button>
        <button id="copy-btn" class="btn-ghost" type="button" disabled>Copy questions</button>
      </div>

      <div class="override">
        <label for="type-select">Work type — override if the call is wrong</label>
        <select id="type-select">
          <option value="">Let the analyser decide</option>
        </select>
      </div>

      <div class="override">
        <label for="cms-select">CMS platform</label>
        <select id="cms-select">
          <option value="">Read it from the site URL</option>
          <option value="AEM">AEM</option>
          <option value="Tridion">Tridion</option>
        </select>
      </div>
    </div>

    <div class="pane-output" id="output"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>

</html>
